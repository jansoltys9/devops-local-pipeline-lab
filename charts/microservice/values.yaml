# Default application name for this lab.
# The chart itself is reusable, but this values file renders Kubernetes objects
# for the devops-local-pipeline-lab service.
nameOverride: ""
fullnameOverride: devops-local-pipeline-lab

replicaCount: 2

image:
  repository: devops-local-pipeline-lab
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: http

container:
  port: 8080

env:
  APP_PORT: "8080"
  APP_VERSION: "1.0.0"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
