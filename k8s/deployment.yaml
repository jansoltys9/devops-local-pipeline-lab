apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-local-pipeline-lab
  labels:
    app: devops-local-pipeline-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-local-pipeline-lab
  template:
    metadata:
      labels:
        app: devops-local-pipeline-lab
    spec:
      containers:
        - name: app
          image: devops-local-pipeline-lab:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_VERSION
              value: "1.0.0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
