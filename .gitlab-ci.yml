stages:
  - test
  - docker-build

variables:
  IMAGE_NAME: "devops-local-pipeline-lab"

go-test:
  stage: test
  image: golang:1.23-alpine
  script:
    - go version
    - go test ./...

docker-build:
  stage: docker-build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker version
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
