stages:
  - test
  - docker-build
  - security-scan
  - helm-validate


variables:
  IMAGE_NAME: "devops-local-pipeline-lab"

go-test:
  stage: test
  image: golang:1.23-alpine
  script:
    - go version
    - go test ./...

docker-build:
  stage: docker-build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker version
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .

trivy-image-scan:
  stage: security-scan
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image
        --exit-code 0
        --ignore-unfixed
        --severity HIGH,CRITICAL
        "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

helm-validate:
  stage: helm-validate
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - helm lint charts/microservice
    - helm template devops-local-pipeline-lab charts/microservice
